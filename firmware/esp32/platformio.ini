; XIAO ESP32S3 Sense
; VS Code で「firmware/esp32」フォルダを開くと PlatformIO がこの ini を認識する。
;
; ★env（環境）が2つある。VS Code 下バーの env アイコンで切り替える：
;    env:seeed_xiao_esp32s3 = 推論用（main.cpp）＝ふだんの検出
;    env:record             = 録音用（record_wav.cpp）＝学習データ集め
;   録音したいときは "record" を選んで Upload、終わったら元に戻す。

; 何も選ばずに Build/Upload したとき、推論用だけを対象にする（record は明示選択のときだけ）
[platformio]
default_envs = seeed_xiao_esp32s3

; ---- 共通設定 ----
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO はネイティブUSBでシリアルを出す。CDC on boot を有効化(必須)。
; これが無いと Serial に何も出ない＝モニタが真っ黒になる定番ハマり。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; WAV録音バッファ等に PSRAM を使う。XIAO ESP32S3 は OPI PSRAM。
board_build.arduino.memory_type = qio_opi

; ---- 推論用（ふだんの検出）----
[env:seeed_xiao_esp32s3]
build_src_filter = +<*> -<record_wav.cpp>

; ---- 録音用（学習データ集め）----
[env:record]
build_src_filter = +<*> -<main.cpp>
