; XIAO ESP32S3 Sense マイクテスト
; VS Code で「firmware/esp32」フォルダを開くと PlatformIO がこの ini を認識する。
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO はネイティブUSBでシリアルを出す。CDC on boot を有効化(必須)。
; これが無いと Serial に何も出ない＝モニタが真っ黒になる定番ハマり。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
